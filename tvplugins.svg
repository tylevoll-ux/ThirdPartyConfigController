<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Cyan/Teal Gradient for the 'V' and 'PLUGINS' -->
    <linearGradient id="brightCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00A8E8" />
    </linearGradient>

    <!-- Dark Blue Gradient for the 'T' -->
    <linearGradient id="darkBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B49" />
      <stop offset="100%" stop-color="#001829" />
    </linearGradient>

    <!-- Optional subtle drop shadow for contrast against any background color -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- LEFT MONOGRAM ICON: TV -->
    <g transform="translate(60, 110)">
      <!-- Big 'T' -->
      <path d="M 0 0 H 130 V 35 H 82 V 200 H 48 V 35 H 0 Z" fill="url(#darkBlueGrad)" />
      
      <!-- Big 'V' overlaying the 'T' -->
      <path d="M 65 0 L 125 200 H 165 L 225 0 H 180 L 145 135 L 110 0 Z" fill="url(#brightCyanGrad)" opacity="0.95" />
    </g>

    <!-- RIGHT TEXT: TV / PLUGINS / CONTROL SYSTEM DEVELOPMENT -->
    <!-- 'TV' Label -->
    <text x="320" y="200" 
          font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-weight="900" 
          font-size="82" 
          fill="#FFFFFF" 
          letter-spacing="2">TV</text>

    <!-- 'PLUGINS' Label -->
    <text x="320" y="270" 
          font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-weight="800" 
          font-size="70" 
          fill="url(#brightCyanGrad)" 
          letter-spacing="3">PLUGINS</text>

    <!-- Subtitle: 'CONTROL SYSTEM DEVELOPMENT' -->
    <text x="323" y="310" 
          font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-weight="600" 
          font-size="20" 
          fill="#A0AAB0" 
          letter-spacing="3.5">CONTROL SYSTEM DEVELOPMENT</text>
  </g>
</svg>